# Workflow nosso, nao do upstream.
#
# Existe como arquivo separado de proposito: mexer no docker-publish.yml deles
# geraria conflito em toda atualizacao que puxarmos. Este arquivo eles nao tem,
# entao nunca conflita.
#
# Diferencas para o deles: publica no ghcr.io (autenticado pelo GITHUB_TOKEN, sem
# secret nenhum), so amd64 (e o que o servidor roda) e sem merge de manifesto.
name: Rugido - Build & Publish (ghcr)

on:
  push:
    branches: [feat/intervencao-humana, feat/workspaces, feat/workspace-members]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: rugido-publish-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/gruporugido/evo-ai-crm-community

jobs:
  build:
    name: Build & push amd64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1

      - uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve tags
        id: tags
        env:
          GH_SHA: ${{ github.sha }}
        run: |
          SHA_SHORT="${GH_SHA:0:7}"
          # sha-* e a tag imutavel: e ela que vai fixada no compose de producao.
          # 1.0.0-rugido e movel, so para conveniencia de quem for testar.
          echo "tags=${IMAGE}:sha-${SHA_SHORT},${IMAGE}:1.0.0-rugido" >> "$GITHUB_OUTPUT"
          echo "Publicando ${IMAGE}:sha-${SHA_SHORT}" >> "$GITHUB_STEP_SUMMARY"

      - name: Build and push
        uses: docker/build-push-action@14487ce63c7a62a4a324b0bfb37086795e31c6c1 # v6.16.0
        with:
          context: .
          file: ./docker/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            RAILS_ENV=production
            BUNDLE_WITHOUT=development:test
            RAILS_SERVE_STATIC_FILES=true
            GIT_SHA=${{ github.sha }}
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha,scope=rugido-amd64
          cache-to: type=gha,scope=rugido-amd64,mode=max
